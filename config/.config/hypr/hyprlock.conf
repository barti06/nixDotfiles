
$font = Iosevka Nerd Font Proportional

# Tokyo Night Colors
$bg_dark        = rgba(22, 22, 30, 0.9)
$bg_pill        = rgba(36, 40, 59, 0.9)
$bg_highlight   = rgba(41, 46, 66, 0.8)
$fg             = rgb(192, 202, 245)
$fg_dark        = rgb(169, 177, 214)
$comment        = rgb(86, 95, 137)
$blue           = rgba(122, 162, 247, 1.0)
$green          = rgba(158, 206, 106, 1.0)
$red            = rgba(247, 118, 142, 1.0)
$magenta        = rgb(187, 154, 247)

# Neutral Text Colors
$time_color     = rgba(245, 245, 250, 0.95)
$date_color     = rgba(205, 214, 224, 0.85)

general {
    hide_cursor = false
    disable_loading_bar = true
}

background {
    monitor =
    path = /home/barti/cfg/modules/wallpapers/wallpaper10.jpg
    blur_passes = 2
    blur_size = 6
    # Darkens the wallpaper (0.0 is transparent, 1.0 is pure black)
    color = rgba(255, 255, 255, 0.99)
}

input-field {
    monitor =
    size = 280, 60
    outline_thickness = 2
    
    # Matching the semi-transparent island/pill background from Waybar
    inner_color = $bg_pill
    outer_color = rgba(122, 162, 247, 0.35)
    
    # State colors
    check_color = $green
    fail_color = $red
    font_color = $fg
    
    fade_on_empty = false
    rounding = 12
    font_family = $font
    placeholder_text = <span foreground="##565f89">Input password...</span>
    fail_text = <span foreground="##f7768e">$FAIL ($ATTEMPTS)</span>
    dots_size = 0.2
    dots_spacing = 0.3
    position = 0, -100
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = $TIME
    color = $time_color
    font_size = 110
    font_family = $font
    position = 0, 240
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d %B %Y")"
    color = $date_color
    font_size = 30
    font_family = $font
    position = 0, 140
    halign = center
    valign = center
}
